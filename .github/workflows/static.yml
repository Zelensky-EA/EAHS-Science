# Deploys ONLY the public website pages to GitHub Pages.
# Apps Script code, archives, and notes stay in the repository but are not published as part of the site.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect website files
        # Add a file here when a new page, stylesheet, or script is added to the website.
        run: |
          mkdir _site
          cp index.html inventory.html reservations.html lab-checkout.html styles.css hub.css app.js config.js _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
